<title>on being human</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  /* The MOUNT ROOT (mount's `container`): full viewport. The action bar, the menu
     drawer and the brush ring anchor here and resolve their cqw/cqh against it — so
     the bar's own width, min(100cqw, calc((100cqh - bar) * --tt-art-aspect)), is
     exactly the art's width below, and it stays centered over the piece. */
  #root {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    container-type: size;
    /* This piece's shape, overriding menu.css's 4 / 3 default. It MUST be set here, on
       an ID selector (1,0,0), and never on `:root` (0,1,0): the engine injects menu.css
       into <head> AFTER this stylesheet, so a `:root` rule here would tie on specificity,
       lose on document order, and silently bake every piece with a 4:3-wide bar. */
    --tt-art-aspect: 16 / 9;
  }
  /* The ART BOX (mount's `element`): the root MINUS the action bar's strip. This is the
     reservation — the canvas and the fail-safe img letterbox inside it, so neither can run
     under the bar at any viewport, in either orientation. Mirrors the app's canvas
     container (`CanvasPage.tsx`: `inset-x-0 top-0 bottom-[44px]`).
     The bar's height is read from the engine's own var so the two can never disagree; the
     44px fallback is not a duplicate of it but the NO-ENGINE-CSS case — menu.css is
     injected by the controller during mount(), and a no-WebGL2 page throws out of
     createEngine BEFORE that, leaving this box to hold the fail-safe img with the var
     never defined. Without the fallback the whole calc would be invalid there. */
  #art {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: var(--action-bar-height, 44px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    container-type: size;
  }
  /* 100cqh is the ART BOX's height — already bar-free — so this is the app's
     min(100vw, calc((100dvh - 44px) * displayAspect)), and the piece fills the space that
     is left at its TRUE aspect. max-* keep the old contain behaviour as a floor if the
     ratio var ever fails to resolve. */
  canvas.ev3-epoch-one-canvas,
  #fallback {
    width: min(100cqw, calc(100cqh * var(--tt-art-aspect)));
    aspect-ratio: var(--tt-art-aspect);
    max-width: 100%;
    max-height: 100%;
  }
  #fallback {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    object-fit: contain;
  }
</style>

                    <span class="tt-icon">∨</span>
                </button>

                    <span class="tt-icon">⏮︎</span>

                <div class="tt-mode-toggle" id="tt-mode-toggle" data-action="toggleManualMode" title="Toggle Manual/Organic Mode (X)">

                    <div class="tt-mode-toggle-track">
                        <div class="tt-mode-toggle-thumb"></div>
                    </div>
                    <span class="tt-mode-toggle-label" data-mode="organic">Organic</span>
                </div>
                <div class="tt-section-label">Movement</div>

                        <span class="tt-icon">⤊</span>
                    </button>
                    <button class="tt-menu-btn" data-action="shuffle" title="Shuffle (S)">
                        <span class="tt-icon">≈</span>
                    </button>
                    <!-- Row 2 -->
                    <button class="tt-menu-btn tt-arrow-btn" data-action="moveLeft" title="Move Left (←)">
                        <span class="tt-icon">←</span>
                    </button>

                        <span class="tt-icon">⏸︎</span>
                    </button>
                    <button class="tt-menu-btn tt-arrow-btn" data-action="moveRight" title="Move Right (→)">
                        <span class="tt-icon">→</span>
                    </button>
                    <!-- Row 3 -->
                    <button class="tt-menu-btn" data-action="eraseMovement" title="Erase Movement (E cycles erase)">
                        <span class="tt-icon">⌫</span>
                    </button>
                    <button class="tt-menu-btn tt-arrow-btn" data-action="waterfallDown" title="Waterfall Down (↓)">
                        <span class="tt-icon">⤋</span>
                    </button>
                    <button class="tt-menu-btn" data-action="freezeBrush" title="Freeze Movement (F)">
                        <span class="tt-icon">❄︎</span>
